apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-user
  namespace: tb-namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /users$2
spec:
  rules:
  - host: tbmicroservices.local
    http:
      paths:
      - path: /api/users(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service
            port:
              number: 3000
---
